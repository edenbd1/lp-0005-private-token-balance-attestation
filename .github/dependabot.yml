version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Risc0 must be bumped manually together with LEZ; group out of automated PRs.
    ignore:
      - dependency-name: "risc0-*"
      - dependency-name: "ruint"
