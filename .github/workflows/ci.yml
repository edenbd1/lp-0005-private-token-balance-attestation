name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the e2e job be run on demand. It is gated to this trigger until it has
  # completed a run on a GitHub runner; see the comment on that job.
  workflow_dispatch:

# Cancel older runs on the same branch when a new commit lands. Avoids the email
# flood that happens when many commits arrive in rapid succession.
# Include the run id for manual dispatches so a push to the same ref does not
# cancel a long e2e run someone started on purpose. Push and pull_request runs
# still supersede each other, which is what avoids the email flood.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  host:
    name: Host-only crates (no Risc0 toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-host-${{ runner.os }}-

      # Only the crates that do NOT transitively depend on `attestation-methods`
      # (whose build script invokes risc0-build and requires the rzup-managed
      # guest Rust toolchain). The remaining crates run locally via
      # `scripts/demo.sh` and the workspace `cargo test` invoked there.
      - name: Build host-safe crates
        run: |
          cargo build --release \
            -p attestation-core \
            -p attestation-verifier-program \
            -p attestation-sequencer-client \
            -p attestation-delivery-transport \
            -p governance-gate

      - name: Test host-safe crates
        run: |
          cargo test --release \
            -p attestation-core \
            -p attestation-verifier-program \
            -p governance-gate

  e2e:
    name: End-to-end against a standalone LEZ sequencer
    runs-on: ubuntu-latest
    # Runs on pushes to the default branch and on demand. Kept off pull_request
    # because a cold LEZ build is ~25 minutes and the host job already covers PRs.
    #
    # Validated on a GitHub runner in run 29737401076: standalone sequencer booted,
    # three programs deployed from an empty chain, a real Risc0 proof generated in
    # 56 s under RISC0_DEV_MODE=0, gated_check confirmed on chain
    # (5bb8dd547e2280834ea0c84103a1d7568c97c4366f8b519f12a4d740357fc108), and its
    # on-chain cost measured at 5,664,960 user cycles.
    #
    # That is the fresh-chain figure and differs slightly from the 5,673,563 in
    # docs/benchmarks/cu-budget.md, which was measured against the public
    # testnet's account pre-state. Both are real measurements of the same guest on
    # different chain states. The 18.75% budget figure quoted in that document is
    # proving cycles over the budget (6,291,456 / 33,554,432), not user cycles;
    # the two must not be conflated.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    env:
      LEZ_TAG: v0.2.0
      SPEL_TAG: v0.6.0
      RISC0_DEV_MODE: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install the Risc0 toolchain
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install rust
          "$HOME/.risc0/bin/rzup" install r0vm 3.0.5

      - name: Check out LEZ ${{ env.LEZ_TAG }}
        uses: actions/checkout@v4
        with:
          repository: logos-blockchain/logos-execution-zone
          ref: ${{ env.LEZ_TAG }}
          path: .lez

      # The sequencer and wallet are the slow part, and they only change when
      # LEZ_TAG changes, so key the cache on the tag alone.
      - name: Cache the LEZ build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .lez/target
          key: lez-${{ runner.os }}-${{ env.LEZ_TAG }}
          restore-keys: lez-${{ runner.os }}-

      - name: Build the standalone sequencer and the wallet
        working-directory: .lez
        run: |
          cargo build --release --features standalone -p sequencer_service
          cargo build --release -p wallet

      # The crate is named `spel`, not `spel-cli`; `spel-cli` is only the
      # directory. Retry without --locked because the committed lockfile can
      # disagree with the runner's rustc.
      - name: Install spel ${{ env.SPEL_TAG }}
        run: |
          cargo install --locked --git https://github.com/logos-co/spel --tag "$SPEL_TAG" spel \
            || cargo install --git https://github.com/logos-co/spel --tag "$SPEL_TAG" spel
          # `spel --help` exits 1 by design, so it cannot be used as a health
          # check. Assert the binary is on PATH instead.
          command -v spel >/dev/null || { echo "spel is not on PATH after install"; exit 1; }
          spel program-id artifacts/programs/attestation_lez.bin >/dev/null \
            || { echo "spel installed but cannot read a program binary"; exit 1; }

      - name: Cache this project's build
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-e2e-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-e2e-${{ runner.os }}-

      # Deploys the committed artifacts/programs/*.bin, generates a real Risc0
      # proof with RISC0_DEV_MODE=0, and requires gated_check to confirm on
      # chain. Exits non-zero on any failure.
      - name: End-to-end round trip on a fresh chain
        env:
          SEQUENCER_BIN: ${{ github.workspace }}/.lez/target/release/sequencer_service
          SEQUENCER_CFG: ${{ github.workspace }}/.lez/lez/sequencer/service/configs/debug/sequencer_config.json
          WALLET_BIN: ${{ github.workspace }}/.lez/target/release/wallet
          SPEL_BIN: spel
        run: ./scripts/e2e-local.sh

      # The CU measurement runs inside e2e-local.sh, against the same sequencer
      # the transaction was submitted to and while it is still up. Measuring it
      # here instead would read account state from a different chain than the one
      # the dry-run was captured on.

      - name: Upload the end-to-end artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-artifacts
          path: artifacts/e2e-local/
          if-no-files-found: ignore
