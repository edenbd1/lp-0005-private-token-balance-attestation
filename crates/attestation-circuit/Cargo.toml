[package]
name = "attestation-circuit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host bindings + baseline harness for the LP-0005 attestation guest."

[[bin]]
name = "baseline"
path = "src/bin/baseline.rs"

[dependencies]
attestation-core = { path = "../attestation-core" }
attestation-methods = { path = "methods" }
risc0-zkvm = { workspace = true, features = ["std", "client"] }
sha2 = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
anyhow = { workspace = true }
hex = { workspace = true }
bincode = { version = "2", features = ["serde"] }
