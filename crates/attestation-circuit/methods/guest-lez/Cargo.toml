[package]
name = "attestation-lez-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Own workspace, like the standalone guest, so cargo does not attach it to the
# parent workspace (different target toolchain).
[workspace]

[[bin]]
name = "attestation_lez"
path = "src/bin/attestation_lez.rs"

[dependencies]
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
attestation-core = { path = "../../../attestation-core", default-features = false }

# The LEZ program ABI. Guest side, so no `host` feature.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", default-features = false }

serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
# Pin ruint to <1.18; 1.18 requires Rust 1.90 but the Risc0 guest toolchain is 1.88.
ruint = { version = "=1.17.2", default-features = false }

# Risc0 patches sha2 to use its hardware accelerator inside the guest.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes.git", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
codegen-units = 1
lto = "fat"
