[package]
name = "attestation-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Stand the guest up as its own workspace so cargo doesn't try to attach it
# to the parent workspace (which uses a different target toolchain).
[workspace]

[[bin]]
name = "attestation"
path = "src/bin/attestation.rs"

[dependencies]
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
attestation-core = { path = "../../../attestation-core", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
# Pin ruint to <1.18; 1.18 requires Rust 1.90 but the Risc0 guest toolchain is 1.88.
# Matches the version LEZ pins in its lockfile (1.17.2).
ruint = { version = "=1.17.2", default-features = false }

# Risc0 patches sha2 to use its hardware accelerator inside the guest.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes.git", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
codegen-units = 1
lto = "fat"
