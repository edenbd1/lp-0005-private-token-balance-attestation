[package]
name = "attestation-verifier-offchain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Off-chain verifier library for LP-0005 attestation credentials."

[dependencies]
attestation-core = { path = "../attestation-core", version = "0.1.0", default-features = false, features = ["std"]  }
attestation-methods = { path = "../attestation-circuit/methods", version = "0.1.0"  }
# `client` feature stays here so `Receipt::verify` is reachable from downstream callers
# (governance-gate, chat-gate, integrations).
risc0-zkvm = { workspace = true, features = ["std", "client"] }
serde = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
hex = { workspace = true }
k256 = { version = "0.14", features = ["ecdsa"] }
thiserror = "1"

[dev-dependencies]
attestation-sdk = { path = "../sdk", version = "0.1.0"  }
rand = "0.8"
