[package]
name = "chat-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference integration #2: off-chain token-gated chat group admission via Logos Messaging."

[dependencies]
attestation-core = { path = "../../crates/attestation-core", version = "0.1.0", default-features = false, features = ["std"]  }
attestation-verifier-program = { path = "../../crates/verifier-program", version = "0.1.0"  }
attestation-verifier-offchain = { path = "../../crates/verifier-offchain", version = "0.1.0"  }
risc0-zkvm = { workspace = true, features = ["std", "client"] }
serde = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
thiserror = "1"

[dev-dependencies]
futures-lite = "2"
bincode = { version = "2", features = ["serde"] }
hex = { workspace = true }
attestation-sdk = { path = "../../crates/sdk", version = "0.1.0"  }
attestation-delivery-transport = { path = "../../crates/delivery-transport", version = "0.1.0" }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
