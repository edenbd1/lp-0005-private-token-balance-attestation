[package]
name = "chat-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference integration #2: off-chain token-gated chat group admission via Logos Messaging."

[dependencies]
attestation-core = { path = "../../crates/attestation-core", default-features = false, features = ["std"] }
attestation-verifier-program = { path = "../../crates/verifier-program" }
attestation-verifier-offchain = { path = "../../crates/verifier-offchain" }
risc0-zkvm = { workspace = true, features = ["std", "client"] }
serde = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
thiserror = "2"

[dev-dependencies]
attestation-sdk = { path = "../../crates/sdk" }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
