[package]
name = "governance-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference integration #1: on-chain governance gate keyed by LP-0005 threshold proofs."

[dependencies]
attestation-core = { path = "../../crates/attestation-core", default-features = false, features = ["std"] }
attestation-verifier-program = { path = "../../crates/verifier-program" }
serde = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
thiserror = "1"

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
